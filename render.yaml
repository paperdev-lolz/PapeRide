services:
  - type: web
    name: paperide-website
    runtime: node
    plan: free
    rootDir: Website
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_INTERNAL_TOKEN
        generateValue: true

  # ---------------------------------------------------------------------------
  # OPTIONAL: Telegram bot service (RENDER PAID PLAN REQUIRED)
  # The free Render tier spins down after ~15 min of inactivity, which breaks
  # the bot's long-polling connection to Telegram. Uncomment below only if you
  # upgrade Render to a paid plan ($7+/mo) so the bot stays awake.
